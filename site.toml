schema = 1
introduction = "Keep maintained documents useful to the people who read them. Inspect the standards, compare examples and improve a rule when it gives the wrong advice."
scope = "repo-gnome addresses maintained documents: whether they state the present, give each fact a home and speak to their readers. Its doctrine, examples and checks are available for inspection."
outside_scope = "These standards do not establish that a document's technical claims are true or that the software it describes works correctly. Those require evidence from the subject itself."

[resources]
glossary = "https://github.com/bugflow/bugflow/blob/master/docs/words.md"
guide = "https://github.com/bugflow/bugflow/blob/master/docs/gnomes.md"
adoption = "https://github.com/bugflow/bugflow/blob/master/docs/gnomes.md#after-a-change-is-merged"
format = "https://github.com/bugflow/bugflow/blob/master/docs/policy-package.md#a-case"

[sources]
readme = "README.md"
skill = "skills/repo-gnome-tidy/SKILL.md"

[example]
title = "Address the document's reader"
policy = "CN-09"
before = "seeded-01-learn-from-use"
after = "clean-01-the-reader-alone"
explanation = "The first case adds instructions for the skill's future maintainer. The second keeps the instructions for the person using the skill. Compare the passages and their expected judgements."

[[checks]]
title = "Find dated rulings in maintained prose"
audience = "author"
policy = "CN-01"
command = "cd /path/to/your/work\n/path/to/repo-gnome/skills/repo-gnome-tidy/scripts/check-dated-ruling"
source = "skills/repo-gnome-tidy/scripts/check-dated-ruling"
purpose = "This script reports prose that describes a decision together with a date. Its policy explains the exclusions."

[[checks]]
title = "Find task-status words in maintained prose"
audience = "author"
policy = "CN-06"
command = "cd /path/to/your/work\n/path/to/repo-gnome/skills/repo-gnome-tidy/scripts/check-status-words"
source = "skills/repo-gnome-tidy/scripts/check-status-words"
purpose = "This script checks for task-status words outside the task structures that its policy permits."

[[checks]]
title = "Find appeals to a maintainer's authority"
audience = "author"
policy = "CN-07"
command = "cd /path/to/your/work\n/path/to/repo-gnome/skills/repo-gnome-tidy/scripts/check-quoted-authority"
source = "skills/repo-gnome-tidy/scripts/check-quoted-authority"
purpose = "This script checks for quoted authority in maintained prose. Its policy states the rule and its limits."

[[checks]]
title = "Validate a standards change"
command = "uv run --with pytest pytest -q"
source = "tests/test_the_files_are_well_formed.py"
purpose = "Check the source formats, case expectations and the deterministic checks against their fixtures."
